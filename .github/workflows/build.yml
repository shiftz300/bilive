name: Build bilive
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools ninja-build libobs-dev
      - run: python tools/platform-build.py .sdk
      - uses: actions/upload-artifact@v4
        with:
          name: bilive-${{ matrix.os }}
          path: dist/bilive-*
          if-no-files-found: error
